# Site Settings
title: Junteng Liu
name: Junteng Liu
description: >-
  First-year PhD candidate at HKUST NLP Group. Research focuses on natural language
  processing and machine learning, with interests in LLM Reasoning and Reinforcement
  Learning, Hallucination in Vision-Language Models, and LLM Truthfulness and Interpretability.
url: https://RoninJourneyman.github.io
baseurl: /LJT-Homepage
repository: RoninJourneyman/LJT-Homepage
repository_tree: master
paginate: 10
paginate_path: /page:num/
timezone: Asia/Hong_Kong

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default

# Outputting
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-include-cache

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

# Site Author
author:
  name: Junteng Liu
  avatar:
  bio: >-
    First-year PhD candidate at HKUST NLP Group. Research focuses on natural language
    processing and machine learning.
  location: Hong Kong
  email: jliugi@connect.ust.hk
  github: Vicent0205
  scholar: tbK9jl4AAAAJ
  links:
    - label: Email
      icon: fas fa-fw fa-envelope-square
      url: mailto:jliugi@connect.ust.hk
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/Vicent0205
    - label: Google Scholar
      icon: fas fa-fw fa-graduation-cap
      url: https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate
    - label: X (Twitter)
      icon: fab fa-fw fa-x-twitter
      url: https://x.com/junteng88716710

# SEO
social:
  type: Person
  links:
    - https://github.com/Vicent0205
    - https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate
    - https://x.com/junteng88716710

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: utf-8

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Analytics
analytics:
  provider: false
